# Render Blueprint: Walk Journal public beta (cloud mode). One FREE web service, no disk: $0.
# Keys are never in this file: every secret is `sync: false`, so Render asks for it in the dashboard.
# The laptop's local mode (python -m basecamp) is unchanged and doesn't use this file.
# Storage is MongoDB Atlas (free M0 cluster, database "walk_journal"): walks, settings and small photos (800 px, ~100 KB,
# no EXIF). Render's free filesystem is wiped on every restart, so nothing is kept on it.
# Atlas starts empty, so the public beta starts with an empty journal. Nothing from a laptop is uploaded.
# The free instance naps after 15 quiet minutes; the first visit after that takes about a minute (the app says so).
services:
  - type: web
    name: walk-journal
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render's proxy passes the visitor's IP, which the daily per-IP limits use
    startCommand: uvicorn basecamp.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    autoDeploy: false        # deploy when you choose, not on every push
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WALKJOURNAL_MODE
        value: cloud          # one private journal per phone, daily limits, sharing off
      - key: MONGODB_URI
        sync: false           # Atlas connection string (Atlas → Connect → Drivers). Network Access must allow 0.0.0.0/0
      - key: MONGODB_DB
        value: walk_journal
      - key: GEMMA_BACKEND
        value: google
      - key: GOOGLE_GEMMA_MODEL
        value: gemma-4-26b-a4b-it   # hosted Gemma 4; accepts images, which the photo checks need
      - key: GOOGLE_API_KEY
        sync: false           # Google AI Studio API key (aistudio.google.com/apikey)
      - key: SERPAPI_KEY
        sync: false           # serpapi.com/manage-api-key ("Find me a walk"). Optional: "Walk from here" works without it
      - key: ELEVENLABS_API_KEY
        sync: false           # optional: read-aloud voice. Without it, phones use their own voice
      - key: ELEVENLABS_VOICE_ID
        sync: false           # optional
      - key: ADMIN_PASSWORD
        generateValue: true   # password for /admin/feedback (any username). Copy it from the dashboard
      - key: SENTRY_DSN
        sync: false           # optional: tracing
